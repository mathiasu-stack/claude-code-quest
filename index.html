<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Code Quest — Kedash Corp Training</title>
  <link rel="stylesheet" href="style.css?v=20260617a">
</head>
<body>

  <!-- Error telemetry — must load before everything else so early
       script failures (e.g. a cache-bust miss breaking a module) are
       reported. POSTs to save_server.py's /errlog; capped at 5
       reports per page load. -->
  <script>
    (function () {
      var sent = 0;
      function report(kind, msg, src, line, col, stack) {
        if (sent >= 5) return;
        sent++;
        try {
          var body = JSON.stringify({
            kind: kind, msg: String(msg).slice(0, 500),
            src: String(src || '').slice(0, 200),
            line: line || 0, col: col || 0,
            stack: String(stack || '').slice(0, 1500),
            url: location.pathname + location.hash,
            ua: navigator.userAgent.slice(0, 120),
          });
          if (navigator.sendBeacon) navigator.sendBeacon('/errlog', body);
          else fetch('/errlog', { method: 'POST', body: body, keepalive: true }).catch(function () {});
        } catch (e) { /* never let the reporter throw */ }
      }
      window.addEventListener('error', function (e) {
        report('error', e.message, e.filename, e.lineno, e.colno, e.error && e.error.stack);
      });
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason || {};
        report('unhandledrejection', r.message || String(e.reason), '', 0, 0, r.stack);
      });
    })();
  </script>

  <header id="mobile-header" class="mobile-header">
    <div class="mobile-header-brand">
      <span>🏢</span>
      <span>Claude Code Quest</span>
    </div>
    <button class="hamburger-btn" id="hamburger-btn" aria-label="Open menu">☰</button>
  </header>
  <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

  <aside id="sidebar"></aside>
  <main id="main-content"></main>

  <!-- Engine -->
  <script src="engine/progress.js?v=20260614a"></script>
  <script src="engine/evaluator.js?v=20260614a"></script>
  <script src="engine/scoring.js?v=20260524d"></script>

  <!-- Data -->
  <script src="data/curriculum.js?v=20260615a"></script>
  <script src="data/curriculum2.js?v=20260615a"></script>
  <!--
    Editor-writable data files — loaded with a per-page-load timestamp
    cache-bust so the in-game editor's "Save Permanently" can drop a
    new file on disk and a normal reload picks it up. Costs ~10 KB
    re-fetch per page load, no manual ?v= bumping required.
  -->
  <script>
    (function() {
      var t = Date.now();
      var files = [
        'rooms.js',                     // scene-layout data (read by roomsLoader)
        'npc_overrides.js',             // per-NPC pos/face overrides
        'lesson_delivery_overrides.js', // per-chapter interactable overrides
        'compound_overrides.js',        // per-child overrides for compound builders
      ];
      for (var i = 0; i < files.length; i++) {
        document.write('<script src="data/' + files[i] + '?t=' + t + '"><\/script>');
      }
    })();
  </script>

  <!-- Story layer (Kedash Protocol) — narrative copy, hand-authored (not
       editor-writable), so normal ?v= cache-busting applies. Must load
       after curriculum2.js and before app.js / play.js consume them. -->
  <script src="data/story_lines.js?v=20260616i"></script>
  <script src="data/story_docs.js?v=20260612b"></script>
  <script src="data/story_scenes.js?v=20260610e"></script>
  <script src="data/story_ambient.js?v=20260610b"></script>

  <!-- Achievements (depends on Progress + CURRICULUM) -->
  <script src="engine/achievements.js?v=20260614a"></script>

  <!-- UI -->
  <script src="ui/dashboard.js?v=20260614a"></script>
  <script src="ui/lesson.js?v=20260613a"></script>
  <script src="ui/test.js?v=20260615g"></script>
  <script src="ui/shop.js?v=20260613a"></script>

  <!-- 3D Play Mode (Three.js, ES module via importmap) -->
  <!-- Vendored three.js 0.169 — no CDN dependency, no offline failure mode.
       Files in play/vendor/ (1.5 MB total); refresh with:
       BASE=https://cdn.jsdelivr.net/npm/three@0.169.0
       curl -fsSL "$BASE/build/three.module.js" -o play/vendor/three.module.js
       (and the matching addons under play/vendor/addons/). -->
  <script type="importmap">
  {
    "imports": {
      "three": "/play/vendor/three.module.js",
      "three/addons/": "/play/vendor/addons/"
    }
  }
  </script>
  <script type="module" src="play/play.js?v=20260617c"></script>

  <!-- App Bootstrap -->
  <script src="app.js?v=20260614a"></script>

</body>
</html>
