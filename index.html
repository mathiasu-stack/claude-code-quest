<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Code Quest — Kedash Corp Training</title>
  <link rel="stylesheet" href="style.css">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
</head>
<body>

  <header id="mobile-header" class="mobile-header">
    <div class="mobile-header-brand">
      <span>🏢</span>
      <span>Claude Code Quest</span>
    </div>
    <button class="hamburger-btn" id="hamburger-btn" aria-label="Open menu">☰</button>
  </header>
  <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

  <aside id="sidebar"></aside>
  <main id="main-content"></main>

  <!-- Engine -->
  <script src="engine/progress.js"></script>
  <script src="engine/evaluator.js"></script>
  <script src="engine/scoring.js"></script>

  <!-- Data -->
  <script src="data/curriculum.js"></script>
  <script src="data/curriculum2.js"></script>

  <!-- Achievements (depends on Progress + CURRICULUM) -->
  <script src="engine/achievements.js"></script>

  <!-- UI -->
  <script src="ui/dashboard.js"></script>
  <script src="ui/lesson.js"></script>
  <script src="ui/test.js"></script>

  <!-- 3D Play Mode (Three.js, ES module via importmap) -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="play/play.js"></script>

  <!-- App Bootstrap -->
  <script src="app.js"></script>

</body>
</html>
